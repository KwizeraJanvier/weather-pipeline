x-airflow-common-env: &airflow-common-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/airflow_meta
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
  WAREHOUSE_DB_HOST: postgres
  WAREHOUSE_DB_PORT: "5432"
  WAREHOUSE_DB_NAME: ${POSTGRES_DB}
  WAREHOUSE_DB_USER: ${POSTGRES_USER}
  WAREHOUSE_DB_PASSWORD: ${POSTGRES_PASSWORD}

x-airflow-common-volumes: &airflow-common-volumes
  - ./dags:/opt/airflow/dags
  - ./extraction:/opt/airflow/extraction
  - ./forecast:/opt/airflow/forecast
  - ./dbt/weather_dbt:/opt/airflow/dbt/weather_dbt
  - airflow_logs:/opt/airflow/logs

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # docker-entrypoint-initdb.d runs files in alphabetical order - the app
      # schema's GRANTs on raw/staging/marts need those schemas to already
      # exist, so each file is explicitly numbered regardless of its source
      # filename in sql/.
      - ./sql/create_airflow_db.sql:/docker-entrypoint-initdb.d/00_create_airflow_db.sql
      - ./sql/init_warehouse_schemas.sql:/docker-entrypoint-initdb.d/01_init_warehouse_schemas.sql
      - ./sql/init_app_schema.sql:/docker-entrypoint-initdb.d/02_init_app_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment: *airflow-common-env
    volumes: *airflow-common-volumes
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username ${_AIRFLOW_WWW_USER_USERNAME:-admin} \
          --password ${_AIRFLOW_WWW_USER_PASSWORD:-admin} \
          --firstname admin --lastname admin --role Admin --email admin@example.com || true

  airflow-webserver:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    depends_on:
      - airflow-init
    environment: *airflow-common-env
    volumes: *airflow-common-volumes
    ports:
      - "8080:8080"
    command: webserver

  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    depends_on:
      - airflow-init
    environment: *airflow-common-env
    volumes: *airflow-common-volumes
    command: scheduler

  metabase:
    image: metabase/metabase:latest
    depends_on:
      - postgres
    ports:
      - "3000:3000"

  webapp:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      WAREHOUSE_DB_HOST: postgres
      WAREHOUSE_DB_PORT: "5432"
      WAREHOUSE_DB_NAME: ${POSTGRES_DB}
      WAREHOUSE_DB_USER: ${POSTGRES_USER}
      WAREHOUSE_DB_PASSWORD: ${POSTGRES_PASSWORD}
      APP_READONLY_DB_USER: app_readonly
      APP_READONLY_DB_PASSWORD: app_readonly
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:-local-dev-only-secret-change-if-ever-deployed}
      # Here the pipeline is an Airflow DAG, not a GitHub Actions workflow
      PIPELINE_SOURCE: airflow
      METABASE_SITE_URL: ${METABASE_SITE_URL:-http://localhost:3000}
      METABASE_EMBED_SECRET: ${METABASE_EMBED_SECRET:-}
      METABASE_DASHBOARD_ID: ${METABASE_DASHBOARD_ID:-}
    ports:
      - "8001:8001"

volumes:
  postgres_data:
  airflow_logs:
