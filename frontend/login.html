<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Sign in - Weather Pipeline</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-body">
  <form class="auth-card" id="auth-form">
    <h1>Weather Pipeline</h1>
    <p class="muted" id="auth-subtitle">Sign in to your account</p>

    <label for="email">Email</label>
    <input type="email" id="email" required autocomplete="email" />

    <label for="password">Password</label>
    <div class="password-field">
      <input type="password" id="password" required autocomplete="current-password" minlength="8" />
      <button type="button" id="toggle-password" aria-label="Show password">Show</button>
    </div>

    <button type="submit" id="submit-btn">Sign in</button>
    <p class="error" id="auth-error"></p>

    <p class="muted switch-line">
      <span id="switch-prompt">No account yet?</span>
      <a href="#" id="switch-link">Create one</a>
    </p>
  </form>

  <script src="login.js"></script>
</body>
</html>
